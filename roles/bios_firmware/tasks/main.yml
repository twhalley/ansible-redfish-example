---
# Write path — stages a BIOS password change via Dell iDRAC Redfish.
# Change is not applied until next reboot (controlled by bios_reboot_on_change).
# On real hardware: a Dell config job is also required (see below).

- name: Stage BIOS setup password change via Redfish
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/Systems/{{ redfish_system_id }}/Bios/Actions/Bios.ChangePassword"
    method: POST
    user: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ redfish_validate_certs }}"
    body_format: json
    body:
      PasswordName: "{{ bios_password_name }}"
      OldPassword: "{{ bios_old_password }}"
      NewPassword: "{{ bios_new_password }}"
    status_code: [200, 202, 204]
  delegate_to: localhost
  register: bios_pw_result

- name: Create Dell config job to apply BIOS change on next reboot
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/Managers/{{ redfish_manager_id }}/Jobs"
    method: POST
    user: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ redfish_validate_certs }}"
    body_format: json
    body:
      TargetSettingsURI: "/redfish/v1/Systems/{{ redfish_system_id }}/Bios/Settings"
    status_code: [200, 202, 404]
  delegate_to: localhost
  register: bios_job_result

- name: Report job ID for change tracking
  ansible.builtin.debug:
    msg: >-
      {{ 'BIOS config job staged: ' + (bios_job_result.json.Id | default('unknown'))
      if bios_job_result.status in [200, 202]
      else 'Job endpoint 404 — expected on mockup; real iDRAC will create a job here' }}
  when: bios_job_result is not skipped

- name: Reboot to apply (only if explicitly enabled)
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/Systems/{{ redfish_system_id }}/Actions/ComputerSystem.Reset"
    method: POST
    user: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ redfish_validate_certs }}"
    body_format: json
    body:
      ResetType: "GracefulRestart"
    status_code: [200, 202, 204]
  delegate_to: localhost
  when: bios_reboot_on_change | bool
