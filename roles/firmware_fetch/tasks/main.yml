---
# Fetches firmware inventory directly via the Redfish URI module.
# Uses retries/until to handle flaky BMC endpoints — a known issue with
# iDRAC under load where the UpdateService can return 503 transiently.

- name: Fetch firmware inventory via Redfish (with retry for flaky BMCs)
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/UpdateService/FirmwareInventory"
    method: GET
    user: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ redfish_validate_certs }}"
    timeout: "{{ firmware_fetch_timeout }}"
    return_content: true
    status_code: 200
  delegate_to: localhost
  register: firmware_uri_raw
  retries: "{{ firmware_fetch_retries }}"
  delay: "{{ firmware_fetch_delay }}"
  until: firmware_uri_raw.status == 200

- name: Fetch each firmware member detail
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}{{ item['@odata.id'] }}"
    method: GET
    user: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ redfish_validate_certs }}"
    timeout: "{{ firmware_fetch_timeout }}"
    return_content: true
    status_code: 200
  delegate_to: localhost
  register: firmware_member_results
  retries: "{{ firmware_fetch_retries }}"
  delay: "{{ firmware_fetch_delay }}"
  until: firmware_member_results.status == 200
  loop: "{{ firmware_uri_raw.json.Members }}"
  loop_control:
    label: "{{ item['@odata.id'] }}"

- name: Set firmware_entries fact from URI results
  ansible.builtin.set_fact:
    firmware_uri_entries: "{{ firmware_member_results.results | map(attribute='json') | list }}"

- name: Display firmware summary
  ansible.builtin.debug:
    msg: "{{ item.Name }} → {{ item.Version }}"
  loop: "{{ firmware_uri_entries }}"
  loop_control:
    label: "{{ item.Name }}"
