---
- name: Load baseline
  ansible.builtin.include_vars:
    file: "{{ compliance_baseline_file }}"
    name: compliance_baseline

- name: Run firmware compliance check
  ansible.builtin.set_fact:
    firmware_findings: "{{ redfish_firmware_entries | check_firmware(compliance_baseline.firmware.required) }}"

- name: Run BIOS compliance check
  ansible.builtin.set_fact:
    bios_findings: "{{ redfish_bios_attrs | check_bios(compliance_baseline.bios.required) }}"

- name: Set overall status and timestamp
  ansible.builtin.set_fact:
    report_timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    overall_status: >-
      {{ 'FAIL' if ((firmware_findings | selectattr('status', 'equalto', 'FAIL') | list | length > 0)
      or (bios_findings | selectattr('status', 'equalto', 'FAIL') | list | length > 0)) else 'PASS' }}

- name: Compliance report - firmware
  ansible.builtin.debug:
    msg: "[{{ item.status }}] {{ item.name }} — required: {{ item.required }}, actual: {{ item.actual }}"
  loop: "{{ firmware_findings }}"

- name: Compliance report - BIOS
  ansible.builtin.debug:
    msg: "[{{ item.status }}] {{ item.attribute }} — required: {{ item.required }}, actual: {{ item.actual }}"
  loop: "{{ bios_findings }}"

- name: Write JSON report
  ansible.builtin.copy:
    content: >-
      {{ {'host': inventory_hostname, 'timestamp': report_timestamp,
      'overall_status': overall_status, 'firmware': firmware_findings,
      'bios': bios_findings} | to_nice_json }}
    dest: "{{ compliance_report_dir }}/{{ inventory_hostname }}_compliance.json"
  delegate_to: localhost

- name: Render HTML report
  ansible.builtin.template:
    src: compliance_report.html.j2
    dest: "{{ compliance_report_dir }}/{{ inventory_hostname }}_compliance.html"
  delegate_to: localhost

- name: Fail if non-compliant
  ansible.builtin.fail:
    msg: "Compliance check FAILED for {{ inventory_hostname }} — review findings above"
  when: overall_status == 'FAIL'
