---
# Desired state for Dell PowerEdge R660xs with iDRAC9
# Versions below represent the minimum acceptable — anything lower = non-compliant
firmware:
  required:
    - name: "BIOS"
      min_version: "2.4.4"
    - name: "Integrated Dell Remote Access Controller"
      min_version: "7.20.10.05"
    - name: "PERC H965i Front"
      min_version: "8.8.0.0.18-26"
    - name: "BOSS-N1 Modular"
      min_version: "2.1.13.2025"

# BIOS attributes — exact required values (security baseline for financial services)
bios:
  required:
    BootMode: "Uefi"
    AesNi: "Enabled"
    SecureBoot: "Enabled"     # mockup has Disabled → deliberate compliance FAIL for the demo
    IntelTxt: "Off"
    IntelSgx: "Off"
    EnergyPerformanceBias: "BalancedPerformance"
