---
redfish_scheme: https
redfish_validate_certs: false      # lab/mock; flip to true in prod once the BMC CA is trusted
redfish_timeout: 30
redfish_retries: 5                 # the JD flags flaky endpoints — we retry transient failures
redfish_retry_delay: 10
baseuri: "{{ bmc_address }}"       # what the community.general redfish_* modules expect

# credentials come from a secrets manager (next step). referenced, never hard-coded:
bmc_username: "{{ vault_bmc_username }}"
bmc_password: "{{ vault_bmc_password }}"
