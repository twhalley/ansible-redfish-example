---
# Inventory of out-of-band controllers (BMCs), NOT operating systems.
# We never SSH to these. Every task is delegated to the control node, which
# speaks Redfish (HTTPS) to bmc_address. Vendor grouping drives which OEM tasks
# and which YAML baseline apply to each host.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    bmc:
      children:
        dell_idrac:
          hosts:
            poc-dell-01:
              bmc_address: 127.0.0.1:8000     # ← the DMTF mockup server (option 2)
              server_model: "PowerEdge R750"
              idrac_generation: 9
        hpe_ilo:
          hosts:
            poc-hpe-01:
              bmc_address: 10.20.30.51
              server_model: "ProLiant DL380 Gen10"
        lenovo_xcc:
          hosts:
            poc-lenovo-01:
              bmc_address: 10.20.30.61
              server_model: "ThinkSystem SR650 V2"
