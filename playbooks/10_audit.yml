---
- name: Audit - collect firmware and BIOS data via Redfish
  hosts: bmc
  gather_facts: false

  tasks:
    - name: Get firmware inventory
      community.general.redfish_info:
        category: Update
        command: GetFirmwareInventory
        baseuri: "{{ baseuri }}"
        username: "{{ bmc_username }}"
        password: "{{ bmc_password }}"
      register: firmware_result
      delegate_to: localhost

    - name: Get BIOS attributes
      community.general.redfish_info:
        category: Systems
        command: GetBiosAttributes
        baseuri: "{{ baseuri }}"
        username: "{{ bmc_username }}"
        password: "{{ bmc_password }}"
      register: bios_result
      delegate_to: localhost

    - name: Display firmware inventory summary
      ansible.builtin.debug:
        msg: "{{ firmware_result.redfish_facts.firmware.entries | map(attribute='Name') | zip(firmware_result.redfish_facts.firmware.entries | map(attribute='Version')) | map('join', ' → ') | list }}"

    - name: Display key BIOS attributes
      ansible.builtin.debug:
        msg: "{{ bios_result.redfish_facts.bios_attribute.entries[0][1] | dict2items | selectattr('key', 'in', ['BootMode', 'AesNi', 'IntelTxt', 'IntelSgx', 'SecureBoot', 'EnergyPerformanceBias', 'ProcHyperThreading']) | list }}"
