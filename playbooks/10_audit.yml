---
- name: Audit - collect and display firmware and BIOS data
  hosts: bmc
  gather_facts: false
  roles:
    - redfish_facts
  tasks:
    - name: Display firmware inventory
      ansible.builtin.debug:
        msg: "{{ redfish_firmware_entries | map(attribute='Name') | zip(redfish_firmware_entries | map(attribute='Version')) | map('join', ' → ') | list }}"

    - name: Display key BIOS attributes
      ansible.builtin.debug:
        msg: "{{ redfish_bios_attrs | dict2items | selectattr('key', 'in', ['BootMode', 'AesNi', 'IntelTxt', 'IntelSgx', 'SecureBoot', 'EnergyPerformanceBias']) | list }}"
